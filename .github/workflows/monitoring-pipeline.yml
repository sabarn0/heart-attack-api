name: Monitoring Pipeline

on:
  push:
    branches: [main]
    paths:
      - "monitoring/**"
      - "docker-compose.monitoring.yml"
  workflow_dispatch: {}

concurrency:
  group: monitoring-pipeline
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy monitoring to VM
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "cd /home/sus/mlops && ./scripts/deploy-monitoring.sh"

      - name: Verify volumes untouched
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "docker volume ls | grep -E 'prometheus_data|grafana_data'"

      - name: Summary
        if: always()
        run: |
          echo "### Monitoring stack redeployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
