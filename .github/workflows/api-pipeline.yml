name: API Pipeline

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "models/**"
      - "Dockerfile"
      - "docker-compose.api.yml"
      - "requirements.txt"
  workflow_dispatch: {}

concurrency:
  group: api-pipeline
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest tests/test_api.py tests/test_package_model.py -v

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          
          # Use a Here-Doc to preserve the exact multi-line structure of the key
          cat << 'EOF' > ~/.ssh/id_rsa
          $SSH_KEY
          EOF
          
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy API to VM
        run: |
          # Connect cleanly using just the verified RSA private key
          ssh -i ~/.ssh/id_rsa "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "cd /home/sus/mlops && ./scripts/deploy-api.sh"

      - name: Verify externally
        run: |
          sleep 5
          curl -sf "http://${{ secrets.VM_HOST }}:8000/health" || \
            (echo "External health check failed" && exit 1)

      - name: Summary
        if: always()
        run: |
          echo "### API deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"